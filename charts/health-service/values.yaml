image:
  repository: health-service
  tag: "0.1.0"
  pullPolicy: IfNotPresent

service:
  port: 8000

outboundRateLimit:
  requestsPerSecond: 10

terminationGracePeriodSeconds: 60

livenessProbe:
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 2
  failureThreshold: 3

readinessProbe:
  initialDelaySeconds: 2
  periodSeconds: 5
  timeoutSeconds: 2
  failureThreshold: 3

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

postgresql:
  image:
    repository: postgres
    tag: "16-alpine"
    pullPolicy: IfNotPresent
  auth:
    database: health_service
    username: health_service
    # Local kind demo credential. Override this value outside local development.
    password: health_service
  persistence:
    accessMode: ReadWriteOnce
    size: 1Gi
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

nameOverride: ""
fullnameOverride: ""
