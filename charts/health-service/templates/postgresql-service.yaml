apiVersion: v1
kind: Service
metadata:
  name: {{ include "health-service.postgresqlName" . }}
  labels:
    {{- include "health-service.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgresql
spec:
  clusterIP: None
  selector:
    {{- include "health-service.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: postgresql
  ports:
    - name: postgresql
      port: 5432
      targetPort: postgresql
      protocol: TCP
