apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "health-service.fullname" . }}-test-connection"
  labels:
    {{- include "health-service.labels" . | nindent 4 }}
    app.kubernetes.io/component: test
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  automountServiceAccountToken: false
  restartPolicy: Never
  securityContext:
    runAsNonRoot: true
    runAsUser: 100
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: curl
      image: curlimages/curl:8.12.1
      imagePullPolicy: IfNotPresent
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
        readOnlyRootFilesystem: true
      command:
        - /bin/sh
        - -ec
      args:
        - >-
          curl --fail --silent --show-error
          http://{{ include "health-service.fullname" . }}:{{ .Values.service.port }}/health
          && curl --fail --silent --show-error
          http://{{ include "health-service.fullname" . }}:{{ .Values.service.port }}/ready
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          cpu: 100m
          memory: 64Mi
