apiVersion: v1
kind: Secret
metadata:
  name: {{ include "health-service.fullname" . }}
  labels:
    {{- include "health-service.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_DB: {{ .Values.postgresql.auth.database | quote }}
  POSTGRES_USER: {{ .Values.postgresql.auth.username | quote }}
  POSTGRES_PASSWORD: {{ .Values.postgresql.auth.password | quote }}
  DATABASE_URL: {{ printf "postgresql://%s:%s@%s:5432/%s" (.Values.postgresql.auth.username | urlquery) (.Values.postgresql.auth.password | urlquery) (include "health-service.postgresqlName" .) (.Values.postgresql.auth.database | urlquery) | quote }}
