apiVersion: v1
kind: Service
metadata:
  name: {{ include "health-service.fullname" . }}
  labels:
    {{- include "health-service.labels" . | nindent 4 }}
    app.kubernetes.io/component: application
spec:
  type: ClusterIP
  selector:
    {{- include "health-service.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: application
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
